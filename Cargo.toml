[package]
name = "lightbringer"
version = "0.1.0"
edition = "2024"
default-run = "lightbringer"

[[bin]]
name = "lightbringer-grpc-client"
path = "src/grpc_client.rs"

[dependencies]
solana-gossip = { git = "https://github.com/Overclock-Validator/agave.git", rev = "bb110d1fad7f1523c13709dcd1a0336f9f9975b4" }
solana-sdk = "3.0.0"
solana-streamer = { git = "https://github.com/Overclock-Validator/agave.git", rev = "bb110d1fad7f1523c13709dcd1a0336f9f9975b4" }
solana-ledger = { git = "https://github.com/Overclock-Validator/agave.git", rev = "bb110d1fad7f1523c13709dcd1a0336f9f9975b4" }
solana-entry = "3.0.14"
solana-net-utils = { git = "https://github.com/Overclock-Validator/agave.git", rev = "bb110d1fad7f1523c13709dcd1a0336f9f9975b4", features = ["agave-unstable-api"] }
solana-quic-definitions = "3.0.0"
solana-rpc-client-types = "3.0.14"
solana-epoch-info = "3.0.0"
solana-core = { git = "https://github.com/Overclock-Validator/agave.git", rev = "bb110d1fad7f1523c13709dcd1a0336f9f9975b4" }
solana-packet = "3.0.0"
solana-commitment-config = "3.1.0"
# Keep these transitive Solana crates pinned to the exact versions required by
# the Agave revision above.
solana-sysvar = { version = "=3.0.0", features = ["serde"] }
solana-hash = { version = "=3.0.0", features = ["serde"] }
solana-blake3-hasher = "=3.0.0"
solana-keccak-hasher = "=3.0.0"
solana-epoch-rewards-hasher = "=3.0.0"
solana-transaction-status-client-types = "3.0.14"

glommio = "0.9.0"
kanal = "0.1.1"
log = "0.4.27"
simple_logger = "5.0.0"
arrayvec = "0.7.6"
ctrlc = "3.4.6"
anyhow = "1.0.98"
futures = { version = "0.3.31", features = ["write-all-vectored"] }
fjall = "3.1.4"
rkyv = { version = "0.8.10", features = ["arrayvec-0_7"] }
scc = "3.0.7"
ohkami = { version = "0.24.1", features = ["rt_glommio"] }
thiserror = "2.0.16"
bincode = "1.3.3"
base64 = "0.22.1"
serde = "1.0"
serde_json = "1.0"
isahc = { version = "1.7.2", features = ["json"] }
oneshot = { version = "0.1.11", features = ["async"] }
jsonrpc-types = "0.3.3"
rand = "0.9.2"
indexmap = "2.11.0"
socket2 = "0.4.10"
influxdb = { version = "0.7.2", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml"] }
http = "1.4.0"
rustls_async = "0.1.1"
rustls = "0.23.35"
rustls-platform-verifier = "0.6.2"
wtx = { version = "0.41.5", features = ["std", "web-socket", "web-socket-handshake"] }
uuid = { version = "1.19.0", features = ["v4"] }
bs58 = "0.5.1"
serde_with = "3.16.1"
uluru = "3.1.0"
circular-buffer = "0.1.9"
lrumap = "0.1.0"

# gRPC streaming dependencies.
tokio = { version = "1.0", features = ["rt", "sync", "time", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tokio-util = { version = "0.7.16", features = ["time"] }


[build-dependencies]
tonic-prost-build = "0.14"

[features]
debug = []
