[package]
name = "overcast"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-gossip = "2.3.7"
solana-sdk = "2.3.1"
solana-streamer = "2.3.7"
solana-ledger = { git = "https://github.com/Overclock-Validator/agave.git", rev = "27f8e18f4f06f0537fa3ab12c884eb692a21c9a5" }
solana-entry = "2.3.7"
solana-net-utils = "2.3.7"
solana-rpc-client-types = "2.3.7"
solana-epoch-info = "2.2.1"
solana-core = "2.3.7"

glommio = "0.9.0"
kanal = "0.1.1"
clap = { version = "4.5.37", features = ["derive"] }
log = "0.4.27"
simple_logger = "5.0.0"
arrayvec = "0.7.6"
ctrlc = "3.4.6"
anyhow = "1.0.98"
futures = "0.3.31"
fjall = "2.9.0"
rkyv = { version = "0.8.10", features = ["arrayvec-0_7"] }
scc = "2.3.4"
lru = "0.14.0"
ohkami = { version = "0.24.1", features = ["rt_glommio"] }
thiserror = "2.0.16"
bincode = "1.3.3"
base64 = "0.22.1"
serde = "1.0"
serde_json = "1.0"
isahc = { version = "1.7.2", features = ["json"] }
oneshot = { version = "0.1.11", features = ["async"] }
jsonrpc-types = "0.3.3"
rand = "0.9.2"
indexmap = "2.11.0"
socket2 = "0.4.10"

[features]
debug = []