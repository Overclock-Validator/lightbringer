[package]
name = "overcast"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-gossip = "2.3.7"
solana-sdk = "2.3.1"
solana-streamer = "2.3.7"
solana-ledger = { git = "https://github.com/Overclock-Validator/agave.git", rev = "886782a443cabe9aedf0f1deea358a4a983ffb5d" }
solana-entry = "2.3.7"
solana-net-utils = "2.3.7"

glommio = "0.9.0"
kanal = "0.1.1"
clap = { version = "4.5.37", features = ["derive"] }
log = "0.4.27"
simple_logger = "5.0.0"
arrayvec = "0.7.6"
ctrlc = "3.4.6"
anyhow = "1.0.98"
futures = "0.3.31"
fjall = "2.9.0"
rkyv = { version = "0.8.10", features = ["arrayvec-0_7"] }
scc = "2.3.4"
lru = "0.14.0"
ohkami = { version = "0.24", features = ["rt_glommio"] }
thiserror = "2.0.16"
bincode = "1.3.3"
base64 = "0.22.1"

[features]
debug = []