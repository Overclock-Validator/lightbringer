# Replace this TEST-NET address with a real Solana gossip entrypoint.
gossip_entrypoint = "203.0.113.10:8000"

# Shred storage path.
storage = "./shred-store"

# Local debug RPC address.
rpc_addr = "127.0.0.1:3000"

# gRPC slot stream address.
grpc_addr = "127.0.0.1:3001"

[gossip]
gossip_port = 65400
port_range_start = 65401
port_range_end = 65500

# Compose mounts the InfluxDB token here.
# Remove this section when running without InfluxDB.
[influxdb]
host = "http://127.0.0.1:18181"
database = "lightbringer"
token_file = "/run/secrets/influxdb-admin-token"

# Enable only when a local RPC node is available.
# [block_confirmation]
# mode = "rpc"
# rpc_http = "http://localhost:8900"
# rpc_websocket = "ws://localhost:8900"
#
# Alpenglow mode streams a slot as confirmed once its finalization certificate verifies
# against the BLS rank map for its epoch. The rank map is read from a snapshot manifest
# auto-discovered under rpc_http (incremental preferred, full snapshot as fallback);
# snapshot_source overrides where that manifest is fetched from if it differs from rpc_http
# (e.g. a dedicated snapshot mirror).
# [block_confirmation]
# mode = "alpenglow"
# rpc_http = "http://localhost:8899"
# snapshot_source = "http://localhost:8899"

# Suppress info/debug logs.
[log]
quiet = false
