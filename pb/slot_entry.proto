syntax = "proto3";

package slot_entry;

message MessageHeader {
    uint32 num_required_signatures = 1;
    uint32 num_readonly_signed_accounts = 2;
    uint32 num_readonly_unsigned_accounts = 3;
}

message CompiledInstruction {
    uint32 program_id_index = 1;
    bytes accounts = 2;
    bytes data = 3;
}

message MessageAddressTableLookup {
    // 32 bytes pubkey
    bytes account_key = 1;
    bytes writable_indexes = 2;
    bytes readonly_indexes = 3;
}

message VersionedMessageLegacy {
    MessageHeader header = 1;
    // Each key is a 32 bytes pubkey
    repeated bytes account_keys = 2;
    // 32 byte hash
    bytes recent_blockhash = 3;
    repeated CompiledInstruction instructions = 4;
}

message VersionedMessageV0 {
    MessageHeader header = 1;
    // Each key is a 32 bytes pubkey
    repeated bytes account_keys = 2;
    // 32 byte hash
    bytes recent_blockhash = 3;
    repeated CompiledInstruction instructions = 4;
    repeated MessageAddressTableLookup address_table_lookups = 5;
}

message TransactionConfig {
    optional uint64 priority_fee = 1;
    optional uint32 compute_unit_limit = 2;
    optional uint32 loaded_accounts_data_size_limit = 3;
    optional uint32 heap_size = 4;
}

message VersionedMessageV1 {
    MessageHeader header = 1;
    TransactionConfig config = 2;
    // 32 byte lifetime specifier hash
    bytes lifetime_specifier = 3;
    // Each key is a 32 bytes pubkey
    repeated bytes account_keys = 4;
    repeated CompiledInstruction instructions = 5;
}

message VersionedTransaction {
    // Each signature is 64 bytes
    repeated bytes signatures = 1;
    oneof message {
        VersionedMessageLegacy message_legacy = 2;
        VersionedMessageV0 message_v0 = 3;
        VersionedMessageV1 message_v1 = 4;
    }
}

message Entry {
    uint64 num_hashes = 1;
    // fixed size, 32 bytes
    bytes hash = 2;
    repeated VersionedTransaction transactions = 3;
}